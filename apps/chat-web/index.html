<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Dona Antônia — Atendimento</title>
  <style>
    :root {
      --bg:#f5f5f2;
      --surface:#ffffff;
      --surface-soft:#f7f7f4;
      --text:#22221f;
      --muted:#73736d;
      --line:#e9e9e3;
      --brand:#b94b2a;
      --brand-soft:#f8eae4;
      --success:#2f7357;
      --shadow:0 12px 34px rgba(26,26,21,.07);
      --radius:22px;
    }
    * { box-sizing:border-box; }
    html,body { min-height:100%; }
    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font:17px/1.48 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button,input { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; }
    .shell {
      width:min(100%,760px);
      min-height:100dvh;
      margin:0 auto;
      background:var(--surface);
      display:grid;
      grid-template-rows:auto 1fr auto;
      position:relative;
    }
    header {
      padding:17px 18px 15px;
      border-bottom:1px solid var(--line);
      display:grid;
      grid-template-columns:1fr auto;
      gap:14px;
      align-items:center;
      background:rgba(255,255,255,.96);
      z-index:5;
    }
    .brand-line {
      display:flex;
      align-items:center;
      gap:11px;
      min-width:0;
    }
    .avatar {
      width:44px;
      height:44px;
      border-radius:50%;
      background:var(--brand-soft);
      display:grid;
      place-items:center;
      font-weight:800;
      color:var(--brand);
      flex:0 0 auto;
    }
    .title { min-width:0; }
    .title strong {
      display:block;
      font-size:18px;
      line-height:1.2;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .title span {
      display:flex;
      align-items:center;
      gap:6px;
      margin-top:3px;
      color:var(--muted);
      font-size:13px;
    }
    .dot {
      width:7px;
      height:7px;
      border-radius:50%;
      background:#59a275;
      flex:0 0 auto;
    }
    .human {
      border:0;
      background:transparent;
      min-height:44px;
      padding:0 6px;
      color:var(--brand);
      font-size:14px;
      font-weight:750;
      cursor:pointer;
    }
    .cartbar {
      grid-column:1/-1;
      display:none;
    }
    .cartbar.visible { display:block; }
    .cartbutton {
      width:100%;
      min-height:44px;
      border:0;
      border-radius:14px;
      padding:9px 13px;
      background:var(--surface-soft);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      cursor:pointer;
    }
    .cartbutton strong { color:var(--brand); }

    main {
      overflow:auto;
      padding:30px 18px 150px;
      scroll-behavior:smooth;
    }
    .day {
      text-align:center;
      color:var(--muted);
      font-size:12px;
      margin:0 0 28px;
    }
    .message-row {
      display:flex;
      margin:0 0 16px;
    }
    .message-row.mine { justify-content:flex-end; }
    .bubble {
      max-width:min(84%,580px);
      padding:13px 16px;
      border-radius:19px 19px 19px 6px;
      background:#f1f1ed;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }
    .mine .bubble {
      background:var(--brand-soft);
      border-radius:19px 19px 6px 19px;
    }
    .system .bubble {
      width:100%;
      max-width:100%;
      text-align:center;
      background:transparent;
      color:var(--muted);
      font-size:14px;
      padding:7px 12px;
    }
    .message-time {
      color:#989891;
      font-size:11px;
      margin:4px 4px 0;
    }
    .mine .message-time { text-align:right; }
    .typing {
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:13px 16px;
      background:#f1f1ed;
      border-radius:19px 19px 19px 6px;
      margin-bottom:16px;
    }
    .typing i {
      width:6px;
      height:6px;
      background:#9e9e98;
      border-radius:50%;
      animation:pulse 1.1s infinite ease-in-out;
    }
    .typing i:nth-child(2){ animation-delay:.14s; }
    .typing i:nth-child(3){ animation-delay:.28s; }
    @keyframes pulse { 0%,60%,100%{opacity:.35;transform:translateY(0)} 30%{opacity:1;transform:translateY(-2px)} }

    .suggestions {
      display:flex;
      flex-wrap:wrap;
      gap:9px;
      margin:2px 0 22px;
    }
    .chip {
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      min-height:44px;
      padding:9px 15px;
      color:var(--text);
      cursor:pointer;
    }
    .chip:active { transform:scale(.985); }

    .commerce-list {
      display:grid;
      gap:14px;
      margin:5px 0 28px;
    }
    .card {
      width:100%;
      max-width:430px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      background:#fff;
      box-shadow:0 5px 18px rgba(30,30,24,.035);
    }
    .card-media {
      width:100%;
      aspect-ratio:16/11;
      background:#f0efeb;
      display:grid;
      place-items:center;
      overflow:hidden;
    }
    .card-media img {
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      background:#fff;
    }
    .card-media.placeholder {
      color:#9b9b95;
      font-size:14px;
    }
    .card-body { padding:17px; }
    .badge {
      display:inline-flex;
      min-height:26px;
      align-items:center;
      padding:4px 9px;
      margin-bottom:8px;
      border-radius:999px;
      background:#fff2dc;
      color:#7d5613;
      font-size:12px;
      font-weight:800;
    }
    .card-title {
      margin:0;
      font-size:17px;
      line-height:1.35;
      font-weight:760;
    }
    .card-desc {
      margin:7px 0 0;
      color:var(--muted);
      font-size:14px;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .prices {
      display:flex;
      align-items:baseline;
      gap:9px;
      margin:13px 0 15px;
    }
    .old-price {
      color:#888881;
      font-size:13px;
      text-decoration:line-through;
    }
    .price {
      font-size:23px;
      font-weight:850;
      letter-spacing:-.02em;
    }
    .primary {
      width:100%;
      min-height:50px;
      border:0;
      border-radius:14px;
      background:var(--brand);
      color:#fff;
      font-weight:800;
      cursor:pointer;
    }
    .primary[disabled] { opacity:.56; cursor:wait; }

    .cart-panel {
      margin:5px 0 26px;
      max-width:470px;
      padding:18px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:#fff;
    }
    .cart-panel h3 { margin:0 0 12px; font-size:17px; }
    .cart-line {
      display:grid;
      grid-template-columns:1fr auto;
      gap:12px;
      padding:9px 0;
      border-bottom:1px solid #f1f1ed;
      font-size:14px;
    }
    .cart-total {
      display:flex;
      justify-content:space-between;
      gap:12px;
      padding-top:14px;
      font-weight:850;
    }

    .status-box {
      margin:20px 0;
      padding:14px 16px;
      border:1px solid var(--line);
      border-radius:16px;
      color:var(--muted);
      font-size:14px;
      background:var(--surface-soft);
    }
    .error {
      color:#8b2c22;
      background:#fff2f0;
      border-color:#f2d0cb;
    }

    footer {
      position:sticky;
      bottom:0;
      padding:12px 14px calc(12px + env(safe-area-inset-bottom));
      border-top:1px solid var(--line);
      background:rgba(255,255,255,.96);
      backdrop-filter:blur(12px);
      z-index:6;
    }
    form {
      display:grid;
      grid-template-columns:44px minmax(0,1fr) 50px;
      gap:8px;
      align-items:end;
    }
    .round {
      width:44px;
      height:44px;
      border:0;
      border-radius:50%;
      background:#f1f1ed;
      color:#65655f;
      cursor:pointer;
    }
    input {
      width:100%;
      min-height:50px;
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px 14px;
      outline:none;
      color:var(--text);
      background:#fff;
    }
    input:focus { border-color:#c9b0a7; box-shadow:0 0 0 3px rgba(185,75,42,.07); }
    .send {
      min-height:50px;
      border:0;
      border-radius:16px;
      background:var(--brand);
      color:#fff;
      font-weight:850;
      cursor:pointer;
    }
    .send[disabled], input[disabled] { opacity:.58; }

    @media (min-width:761px) {
      body { padding:28px 0; }
      .shell {
        min-height:calc(100dvh - 56px);
        max-height:calc(100dvh - 56px);
        border:1px solid var(--line);
        border-radius:28px;
        box-shadow:var(--shadow);
        overflow:hidden;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand-line">
        <div class="avatar" aria-hidden="true">DA</div>
        <div class="title">
          <strong>Dona Antônia</strong>
          <span><i class="dot"></i> Assistente virtual · atendimento online</span>
        </div>
      </div>
      <button class="human" id="humanButton" type="button">Falar com uma pessoa</button>
      <div class="cartbar" id="cartbar">
        <button class="cartbutton" id="cartButton" type="button">
          <span>Seu pedido</span>
          <strong id="cartSummary">0 itens</strong>
        </button>
      </div>
    </header>

    <main id="messages" aria-live="polite">
      <div class="day">Atendimento Dona Antônia</div>
      <div class="status-box" id="bootStatus">Abrindo seu atendimento…</div>
    </main>

    <footer>
      <form id="composer">
        <button class="round" type="button" id="plusButton" aria-label="Mais opções">+</button>
        <input id="input" autocomplete="off" placeholder="Digite uma mensagem…" aria-label="Mensagem" disabled />
        <button class="send" id="sendButton" type="submit" aria-label="Enviar" disabled>↑</button>
      </form>
    </footer>
  </div>

<script>
(() => {
  const ENDPOINT = "https://qxstkwshuvplmmftrctj.supabase.co/functions/v1/chat-gateway-v1";
  const ORG_SLUG = "dona-antonia";
  const TOKEN_KEY = "chat_commerce_dona_antonia_session_v1";

  const messagesEl = document.querySelector("#messages");
  const input = document.querySelector("#input");
  const form = document.querySelector("#composer");
  const sendButton = document.querySelector("#sendButton");
  const humanButton = document.querySelector("#humanButton");
  const plusButton = document.querySelector("#plusButton");
  const cartbar = document.querySelector("#cartbar");
  const cartSummary = document.querySelector("#cartSummary");
  const cartButton = document.querySelector("#cartButton");

  let token = localStorage.getItem(TOKEN_KEY) || "";
  let sending = false;
  let typingEl = null;
  let currentCart = null;

  const money = cents => new Intl.NumberFormat("pt-BR", {
    style:"currency", currency:"BRL"
  }).format((Number(cents) || 0) / 100);

  const time = value => {
    if (!value) return "";
    try { return new Date(value).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }
    catch { return ""; }
  };

  function scrollBottom() {
    requestAnimationFrame(() => messagesEl.scrollTop = messagesEl.scrollHeight);
  }

  function clearBoot() {
    document.querySelector("#bootStatus")?.remove();
  }

  function status(text, isError=false) {
    clearBoot();
    const box=document.createElement("div");
    box.className="status-box"+(isError?" error":"");
    box.textContent=text;
    messagesEl.appendChild(box);
    scrollBottom();
    return box;
  }

  function bubble(message) {
    const sender = message.sender_type || message.senderType;
    const body = message.body_text ?? message.bodyText ?? "";
    const row=document.createElement("div");
    row.className="message-row "+(sender==="customer"?"mine":sender==="system"?"system":"assistant");

    const wrap=document.createElement("div");
    const b=document.createElement("div");
    b.className="bubble";
    b.textContent=body;
    wrap.appendChild(b);

    if (message.created_at) {
      const t=document.createElement("div");
      t.className="message-time";
      t.textContent=time(message.created_at);
      wrap.appendChild(t);
    }

    row.appendChild(wrap);
    messagesEl.appendChild(row);

    const payload=message.payload || {};
    if (Array.isArray(payload.suggestions)) renderSuggestions(payload.suggestions);
    if (payload.ui?.type==="commerce_list" && Array.isArray(payload.ui.items)) {
      renderCommerce(payload.ui.items);
    }
    if (payload.cart) renderCartPanel(payload.cart);

    scrollBottom();
  }

  function renderSuggestions(items) {
    const old=document.querySelector(".suggestions[data-active='1']");
    if (old) old.dataset.active="0";

    const box=document.createElement("div");
    box.className="suggestions";
    box.dataset.active="1";

    items.slice(0,4).forEach(label => {
      const button=document.createElement("button");
      button.type="button";
      button.className="chip";
      button.textContent=label;
      button.addEventListener("click", () => handleSuggestion(label));
      box.appendChild(button);
    });

    messagesEl.appendChild(box);
  }

  function imageFor(item) {
    const media=document.createElement("div");
    media.className="card-media";
    if (item.imageUrl) {
      const img=document.createElement("img");
      img.loading="lazy";
      img.decoding="async";
      img.alt=item.name || "Produto";
      img.src=item.imageUrl;
      img.onerror=() => {
        media.innerHTML="";
        media.classList.add("placeholder");
        media.textContent="Imagem indisponível";
      };
      media.appendChild(img);
    } else {
      media.classList.add("placeholder");
      media.textContent="Imagem indisponível";
    }
    return media;
  }

  function renderCommerce(items) {
    if (!items.length) return;
    const list=document.createElement("div");
    list.className="commerce-list";

    items.forEach(item => {
      const card=document.createElement("article");
      card.className="card";
      card.appendChild(imageFor(item));

      const body=document.createElement("div");
      body.className="card-body";

      if (item.badge) {
        const badge=document.createElement("span");
        badge.className="badge";
        badge.textContent=item.badge;
        body.appendChild(badge);
      }

      const title=document.createElement("h3");
      title.className="card-title";
      title.textContent=item.name || "Produto";
      body.appendChild(title);

      if (item.description) {
        const desc=document.createElement("p");
        desc.className="card-desc";
        desc.textContent=item.description;
        body.appendChild(desc);
      }

      const prices=document.createElement("div");
      prices.className="prices";
      if (item.regularPriceCents && item.regularPriceCents > item.priceCents) {
        const old=document.createElement("span");
        old.className="old-price";
        old.textContent=money(item.regularPriceCents);
        prices.appendChild(old);
      }
      const price=document.createElement("span");
      price.className="price";
      price.textContent=money(item.priceCents);
      prices.appendChild(price);
      body.appendChild(prices);

      const action=document.createElement("button");
      action.type="button";
      action.className="primary";
      action.textContent=item.kind==="basket" ? "Quero essa cesta" : "Adicionar";
      action.addEventListener("click", async () => {
        action.disabled=true;
        const before=action.textContent;
        action.textContent="Adicionando…";
        try {
          const data = item.kind==="basket"
            ? await api("add_basket",{basketId:item.id})
            : await api("add_product",{productId:item.id});
          if (data.message) bubble(data.message);
          updateCart(data.cart);
          action.textContent="Adicionado ✓";
        } catch (e) {
          action.disabled=false;
          action.textContent=before;
          status("Não consegui adicionar agora. Tente novamente.",true);
        }
      });

      body.appendChild(action);
      card.appendChild(body);
      list.appendChild(card);
    });

    messagesEl.appendChild(list);
    scrollBottom();
  }

  function updateCart(cart) {
    currentCart=cart || null;
    if (!cart || !cart.itemCount) {
      cartbar.classList.remove("visible");
      return;
    }
    cartbar.classList.add("visible");
    const qty=Number(cart.itemCount)||0;
    cartSummary.textContent=`${qty} ${qty===1?"item":"itens"} · ${money(cart.total_cents)}`;
  }

  function renderCartPanel(cart) {
    updateCart(cart);
    const panel=document.createElement("div");
    panel.className="cart-panel";
    const title=document.createElement("h3");
    title.textContent="Seu pedido";
    panel.appendChild(title);

    (cart.items || []).forEach(item => {
      const line=document.createElement("div");
      line.className="cart-line";
      const name=document.createElement("span");
      name.textContent=`${Number(item.quantity)}× ${item.name_snapshot}`;
      const value=document.createElement("strong");
      value.textContent=money(item.total_cents);
      line.append(name,value);
      panel.appendChild(line);
    });

    const total=document.createElement("div");
    total.className="cart-total";
    total.innerHTML=`<span>Total</span><span>${money(cart.total_cents)}</span>`;
    panel.appendChild(total);

    const close=document.createElement("button");
    close.type="button";
    close.className="primary";
    close.style.marginTop="16px";
    close.textContent="Fechar pedido";
    close.addEventListener("click", startCheckout);
    panel.appendChild(close);

    messagesEl.appendChild(panel);
    scrollBottom();
  }

  function showTyping() {
    hideTyping();
    typingEl=document.createElement("div");
    typingEl.className="typing";
    typingEl.innerHTML="<i></i><i></i><i></i>";
    messagesEl.appendChild(typingEl);
    scrollBottom();
  }
  function hideTyping() {
    typingEl?.remove();
    typingEl=null;
  }

  async function api(action, extra={}) {
    const headers={"content-type":"application/json"};
    if (token) headers["x-chat-session-token"]=token;

    const res=await fetch(ENDPOINT,{
      method:"POST",
      headers,
      body:JSON.stringify({action,...extra})
    });

    let data={};
    try { data=await res.json(); } catch {}

    if (!res.ok) {
      const err=new Error(data.error || "request_failed");
      err.code=data.error;
      err.status=res.status;
      throw err;
    }
    return data;
  }

  async function startSession() {
    const data=await api("start_session",{organizationSlug:ORG_SLUG});
    token=data.session.token;
    localStorage.setItem(TOKEN_KEY,token);
    clearBoot();
    (data.messages || []).forEach(bubble);
    input.disabled=false;
    sendButton.disabled=false;
    input.focus();
  }

  async function restore() {
    if (!token) return startSession();
    try {
      const data=await api("get_messages");
      clearBoot();
      (data.messages || []).forEach(bubble);
      updateCart(data.cart);
      input.disabled=false;
      sendButton.disabled=false;
    } catch (e) {
      if (e.status===401) {
        localStorage.removeItem(TOKEN_KEY);
        token="";
        return startSession();
      }
      throw e;
    }
  }

  async function handleSuggestion(label) {
    const n=label.toLowerCase();
    if (n.includes("cesta")) {
      showTyping();
      try {
        const data=await api("list_baskets");
        hideTyping();
        bubble(data.message);
      } catch { hideTyping(); status("Não consegui carregar as cestas agora.",true); }
      return;
    }
    if (n.includes("oferta")) {
      showTyping();
      try {
        const data=await api("list_offers");
        hideTyping();
        bubble(data.message);
      } catch { hideTyping(); status("Não consegui carregar as ofertas agora.",true); }
      return;
    }
    if (n.includes("ver meu pedido")) {
      return showCart();
    }
    if (n.includes("fechar pedido")) {
      return startCheckout();
    }
    if (n.includes("confirmar pedido")) {
      showTyping();
      try {
        const data=await api("confirm_order");
        hideTyping();
        if (data.message) bubble(data.message);
        updateCart(null);
      } catch (e) {
        hideTyping();
        if (e.code==="checkout_not_ready") {
          await send(label);
        } else {
          status("Não consegui confirmar o pedido agora. Tente novamente.",true);
        }
      }
      return;
    }
    if (n.includes("continuar")) {
      input.focus();
      return;
    }
    if (n.includes("procurar")) {
      input.placeholder="Qual produto você procura?";
      input.focus();
      return;
    }
    await send(label);
  }

  async function startCheckout() {
    if (sending) return;
    showTyping();
    try {
      const data=await api("start_checkout");
      hideTyping();
      if (data.message) bubble(data.message);
      updateCart(data.cart);
      input.focus();
    } catch (e) {
      hideTyping();
      if (e.code==="empty_cart") {
        status("Seu pedido ainda está vazio.");
      } else {
        status("Não consegui iniciar o fechamento agora.",true);
      }
    }
  }

  async function showCart() {
    try {
      const data=await api("get_cart");
      if (!data.cart?.itemCount) {
        status("Seu pedido ainda está vazio.");
        return;
      }
      renderCartPanel(data.cart);
    } catch { status("Não consegui abrir seu pedido agora.",true); }
  }

  async function send(text) {
    const value=(text ?? input.value).trim();
    if (!value || sending) return;

    sending=true;
    input.value="";
    input.disabled=true;
    sendButton.disabled=true;

    bubble({
      sender_type:"customer",
      body_text:value,
      created_at:new Date().toISOString()
    });

    showTyping();
    const started=Date.now();

    try {
      const data=await api("send_message",{
        text:value,
        clientMessageId:crypto.randomUUID()
      });

      const elapsed=Date.now()-started;
      const minPace=520;
      if (elapsed<minPace) await new Promise(r=>setTimeout(r,minPace-elapsed));

      hideTyping();
      if (data.assistant) bubble(data.assistant);
      updateCart(data.cart);
    } catch {
      hideTyping();
      status("A conexão falhou. Sua mensagem não foi perdida aqui na tela; tente enviar novamente.",true);
    } finally {
      sending=false;
      input.disabled=false;
      sendButton.disabled=false;
      input.focus();
    }
  }

  form.addEventListener("submit",e=>{e.preventDefault();send();});
  humanButton.addEventListener("click",async()=>{
    humanButton.disabled=true;
    try {
      showTyping();
      const data=await api("request_human");
      hideTyping();
      if(data.message) bubble(data.message);
      humanButton.textContent="Atendimento solicitado";
    } catch {
      hideTyping();
      status("Não consegui chamar uma pessoa agora. Tente novamente.",true);
      humanButton.disabled=false;
    }
  });
  cartButton.addEventListener("click",showCart);
  plusButton.addEventListener("click",()=>{
    renderSuggestions(["Ver cestas","Ver ofertas","Procurar produto","Ver meu pedido"]);
    scrollBottom();
  });

  restore().catch(() => {
    status("Não consegui abrir seu atendimento. Atualize a página para tentar novamente.",true);
  });
})();
</script>
</body>
</html>
