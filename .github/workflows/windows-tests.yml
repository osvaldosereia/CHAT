name: Windows unit and Qt tests

on:
  push:
    branches:
      - codex/bambu-a1-mini-foundation-20261029
    paths:
      - ".github/workflows/windows-tests.yml"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install local package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run unit and offscreen Qt tests
        run: python -m pytest -v
