name: Windows standalone build check

on:
  push:
    branches:
      - codex/bambu-a1-mini-foundation-20261029
    paths:
      - ".github/workflows/windows-build.yml"
      - "pyproject.toml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install local application
        run: python -m pip install -e .

      - name: Prepare MSVC and build standalone application
        shell: pwsh
        run: |
          $vswhere = Join-Path "${env:ProgramFiles(x86)}" "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "Visual Studio locator was not found on the Windows runner."
          }
          $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsInstall) {
            throw "Visual Studio x64 C++ build tools were not found."
          }
          $vcvars = Join-Path $vsInstall "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path -LiteralPath $vcvars -PathType Leaf)) {
            throw "The x64 Visual C++ environment script was not found."
          }
          $environmentFile = Join-Path $env:RUNNER_TEMP "bambuprep-vcvars-env.txt"
          $command = 'call "' + $vcvars + '" x64 >nul && set > "' + $environmentFile + '"'
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $environmentFile -PathType Leaf)) {
            throw "Visual C++ could not initialize its x64 environment."
          }
          foreach ($line in Get-Content -LiteralPath $environmentFile) {
            $separator = $line.IndexOf("=")
            if ($separator -gt 0) {
              $name = $line.Substring(0, $separator)
              $value = $line.Substring($separator + 1)
              Set-Item -Path ("Env:" + $name) -Value $value
            }
          }
          Remove-Item -LiteralPath $environmentFile -Force
          if (-not (Get-Command dumpbin.exe -ErrorAction SilentlyContinue)) {
            throw "dumpbin.exe is unavailable after initializing Visual Studio."
          }

          pyside6-deploy src/bambuprep/__main__.py --init --force
          if ($LASTEXITCODE -ne 0) { throw "Could not initialize standalone deployment settings." }
          pyside6-deploy src/bambuprep/__main__.py --force --mode standalone
          if ($LASTEXITCODE -ne 0) { throw "The standalone application build failed." }

          $bundle = Join-Path $env:GITHUB_WORKSPACE "dist\BambuPrep.dist"
          $executable = Join-Path $bundle "BambuPrep.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "dist") -Recurse -Force | Select-Object FullName
            throw "Standalone executable was not created at the expected path."
          }
          if ((Get-Item -LiteralPath $executable).Length -le 0) {
            throw "Standalone executable is empty."
          }

          $privateExtensions = @(".stl", ".3mf", ".sqlite", ".sqlite3", ".db", ".log")
          $privateFiles = Get-ChildItem -LiteralPath $bundle -File -Recurse | Where-Object {
            $privateExtensions -contains $_.Extension.ToLowerInvariant()
          }
          if ($privateFiles) {
            $privateFiles | Select-Object FullName
            throw "Standalone output contains model or local-history files."
          }
          Write-Output "Standalone bundle exists and contains no STL, 3MF, database, or log files."
