[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bambuprep"
version = "0.1.0"
description = "Local Windows preparation and analysis for Bambu Lab A1 mini prints"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - personal project" }
dependencies = ["keyring>=25.5,<27"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
