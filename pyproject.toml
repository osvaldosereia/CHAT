[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bambuprep"
version = "0.1.0"
description = "Local Windows preparation and analysis for Bambu Lab A1 mini prints"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - personal project" }
dependencies = [
  "PySide6>=6.8,<7",
  "keyring>=25.5,<27",
  "trimesh>=4.6,<5",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "fast-simplification>=0.1.12,<1",
  "networkx>=3,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["Nuitka==4.3.1"]

[project.scripts]
bambuprep = "bambuprep.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
